<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <!-- city blocks -->
  <g fill="#fff" fill-opacity=".06">
    <rect x="80" y="30" width="140" height="70" rx="6"/><rect x="80" y="130" width="140" height="80" rx="6"/>
    <rect x="300" y="20" width="180" height="90" rx="6"/><rect x="560" y="140" width="160" height="80" rx="6"/>
    <rect x="800" y="30" width="150" height="70" rx="6"/><rect x="1010" y="120" width="160" height="100" rx="6"/>
  </g>
  <!-- roads -->
  <path d="M-10 118 H1210 M250 -10 V250 M760 -10 V250" stroke="#0f172a" stroke-opacity=".35" stroke-width="22"/>
  <path d="M-10 118 H1210 M250 -10 V250 M760 -10 V250" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="14 12"/>
  <!-- route -->
  <path d="M110 200 C180 200 210 150 250 118 S420 60 520 118 S700 190 760 150 S900 70 1080 80" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 12"/>
  <!-- pins -->
  <g>
    <path d="M110 200 c-14 -18 -20 -28 -20 -38 a20 20 0 0 1 40 0 c0 10 -6 20 -20 38z" fill="#f43f5e"/><circle cx="110" cy="162" r="7" fill="#fff"/>
    <path d="M1080 80 c-14 -18 -20 -28 -20 -38 a20 20 0 0 1 40 0 c0 10 -6 20 -20 38z" fill="#22c55e"/><circle cx="1080" cy="42" r="7" fill="#fff"/>
  </g>
  <!-- trucks -->
  <g transform="translate(470 96)">
    <rect width="54" height="30" rx="4" fill="#f8fafc"/><path d="M54 8 h16 l10 12 v10 h-26z" fill="#fbbf24"/>
    <circle cx="14" cy="32" r="6" fill="#0f172a"/><circle cx="66" cy="32" r="6" fill="#0f172a"/>
  </g>
  <g transform="translate(735 170) rotate(-90)">
    <rect width="44" height="24" rx="4" fill="#f8fafc"/><path d="M44 6 h12 l8 10 v8 h-20z" fill="#38bdf8"/>
    <circle cx="11" cy="26" r="5" fill="#0f172a"/><circle cx="54" cy="26" r="5" fill="#0f172a"/>
  </g>
  <!-- signal rings -->
  <g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"><circle cx="497" cy="100" r="34"/><circle cx="497" cy="100" r="52" stroke-opacity=".25"/></g>
</svg>
