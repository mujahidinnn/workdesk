<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78350f"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <g id="rack"><rect width="150" height="36" rx="4" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
      <g fill="#fde68a"><rect x="8" y="7" width="22" height="22" rx="3"/><rect x="36" y="7" width="22" height="22" rx="3" fill-opacity=".6"/><rect x="92" y="7" width="22" height="22" rx="3"/><rect x="120" y="7" width="22" height="22" rx="3" fill-opacity=".6"/></g></g>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <!-- floor plan outline -->
  <rect x="40" y="16" width="1120" height="208" rx="10" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- racks, two rows per block -->
  <g><use href="#rack" x="90" y="40"/><use href="#rack" x="90" y="84"/><use href="#rack" x="90" y="160"/>
     <use href="#rack" x="300" y="40"/><use href="#rack" x="300" y="84"/><use href="#rack" x="300" y="160"/>
     <use href="#rack" x="510" y="40"/><use href="#rack" x="510" y="84"/><use href="#rack" x="510" y="160"/>
     <use href="#rack" x="720" y="40"/><use href="#rack" x="720" y="84"/><use href="#rack" x="720" y="160"/></g>
  <!-- forklift lane -->
  <path d="M70 140 H900" stroke="#fef3c7" stroke-opacity=".7" stroke-width="3" stroke-dasharray="16 10"/>
  <path d="M900 140 l-14 -8 v16z" fill="#fef3c7" fill-opacity=".7"/>
  <!-- loading dock -->
  <g transform="translate(940 40)">
    <rect width="190" height="160" rx="8" fill="#fff" fill-opacity=".12"/>
    <g fill="#fff" fill-opacity=".85"><rect x="18" y="18" width="46" height="40" rx="4"/><rect x="72" y="18" width="46" height="40" rx="4"/><rect x="126" y="18" width="46" height="40" rx="4"/></g>
    <g stroke="#78350f" stroke-opacity=".35" stroke-width="2"><path d="M22 30h38M22 40h38M22 50h38M76 30h38M76 40h38M76 50h38M130 30h38M130 40h38M130 50h38"/></g>
    <!-- boxes -->
    <g><rect x="30" y="100" width="40" height="40" rx="3" fill="#fbbf24"/><rect x="74" y="112" width="28" height="28" rx="3" fill="#fde68a"/><rect x="40" y="76" width="28" height="24" rx="3" fill="#fde68a"/><path d="M50 100v40M30 120h40" stroke="#b45309" stroke-opacity=".5" stroke-width="2"/></g>
    <!-- forklift -->
    <g transform="translate(118 104)"><rect width="34" height="26" rx="4" fill="#ef4444"/><path d="M34 2 v34 M34 34 h18" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/><circle cx="8" cy="30" r="6" fill="#1c1917"/><circle cx="28" cy="30" r="6" fill="#1c1917"/></g>
  </g>
</svg>
