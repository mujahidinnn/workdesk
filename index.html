    <!-- No-flash theme script: apply saved theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
